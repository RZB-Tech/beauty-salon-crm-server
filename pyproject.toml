dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "faker>=40.23.0",
    "fastapi[logger]>=0.136.3",
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.13.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.49.0",
